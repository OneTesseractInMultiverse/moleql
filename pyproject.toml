[project]
name = "moleql"
version = "0.2.0"
description = "Parse URL-style queries into MongoDB filters, sort, projection, and pagination data."
readme = "README.md"
authors = [
    { name = "Pedro Guzmán", email = "pedro@subvertic.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dateparser>=1.2.2",
    "pymongo>=4.15.3",
]

[project.urls]
Homepage = "https://github.com/OneTesseractInMultiverse/moleql"
Issues = "https://github.com/OneTesseractInMultiverse/moleql/issues"

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "PERF"]
ignore = []  # add codes you want to silence

[tool.ruff.format]

[tool.coverage.run]
source = ["src/moleql"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.hatch.build.include]
paths = ["LICENSE", "NOTICE", "AUTHORS"]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "pyinstrument>=5.1.1",
    "pytest>=8.4.2",
    "pytest-benchmark>=5.2.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.4",
]
